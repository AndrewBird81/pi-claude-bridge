name: Check upstream release

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Report a newer stable upstream release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(cat .upstream-release)
          latest=$(git ls-remote --tags --refs https://github.com/elidickinson/pi-claude-bridge.git \
            | awk -F/ '$NF ~ /^v[0-9]+\\.[0-9]+\\.[0-9]+$/ {print $NF}' \
            | sort -V | tail -n1)
          test -n "$latest"
          if [[ "$current" != "$latest" ]]; then
            gh issue list --state open --search "upstream release $latest in:title" --limit 1 \
              | grep -q . || gh issue create --title "Upstream release $latest needs synchronization" \
              --body "Run scripts/sync-upstream, resolve semantic conflicts manually, and review the release-to-HEAD diff."
          fi
